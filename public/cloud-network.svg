<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Cloud Infrastructure Network Pattern - Optimized SVG -->
  <defs>
    <!-- Gradient for nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background grid -->
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Network connections (lines) -->
  <g stroke="#3b82f6" stroke-opacity="0.15" stroke-width="1">
    <!-- Main backbone -->
    <path d="M100,200 Q200,150 300,180 T500,160 T700,200"/>
    <path d="M150,280 Q300,220 450,250 T650,230"/>
    <path d="M100,120 Q250,100 400,130 T650,110"/>
    
    <!-- Cross connections -->
    <line x1="200" y1="100" x2="250" y2="180"/>
    <line x1="350" y1="130" x2="380" y2="200"/>
    <line x1="500" y1="110" x2="520" y2="170"/>
    <line x1="300" y1="180" x2="350" y2="250"/>
    <line x1="450" y1="160" x2="480" y2="240"/>
    <line x1="600" y1="150" x2="620" y2="220"/>
    
    <!-- Vertical links -->
    <line x1="150" y1="120" x2="150" y2="200"/>
    <line x1="400" y1="100" x2="400" y2="180"/>
    <line x1="550" y1="120" x2="550" y2="200"/>
    <line x1="250" y1="200" x2="280" y2="280"/>
    <line x1="500" y1="180" x2="520" y2="260"/>
  </g>
  
  <!-- Secondary connections (lighter) -->
  <g stroke="#8b5cf6" stroke-opacity="0.1" stroke-width="0.5">
    <path d="M50,150 Q150,180 250,150"/>
    <path d="M550,280 Q650,250 750,280"/>
    <path d="M200,320 Q350,290 500,320"/>
  </g>
  
  <!-- Network nodes (circles with glow) -->
  <g>
    <!-- Primary nodes -->
    <circle cx="150" cy="120" r="20" fill="url(#nodeGlow)"/>
    <circle cx="150" cy="120" r="4" fill="#3b82f6" fill-opacity="0.6"/>
    
    <circle cx="300" cy="180" r="25" fill="url(#nodeGlow)"/>
    <circle cx="300" cy="180" r="5" fill="#3b82f6" fill-opacity="0.7"/>
    
    <circle cx="400" cy="130" r="20" fill="url(#nodeGlow)"/>
    <circle cx="400" cy="130" r="4" fill="#3b82f6" fill-opacity="0.6"/>
    
    <circle cx="500" cy="160" r="28" fill="url(#nodeGlow)"/>
    <circle cx="500" cy="160" r="6" fill="#3b82f6" fill-opacity="0.8"/>
    
    <circle cx="650" cy="140" r="22" fill="url(#nodeGlow)"/>
    <circle cx="650" cy="140" r="4.5" fill="#3b82f6" fill-opacity="0.65"/>
    
    <!-- Secondary nodes -->
    <circle cx="200" cy="200" r="18" fill="url(#nodeGlow)"/>
    <circle cx="200" cy="200" r="3.5" fill="#8b5cf6" fill-opacity="0.5"/>
    
    <circle cx="450" cy="250" r="20" fill="url(#nodeGlow)"/>
    <circle cx="450" cy="250" r="4" fill="#8b5cf6" fill-opacity="0.55"/>
    
    <circle cx="600" cy="220" r="18" fill="url(#nodeGlow)"/>
    <circle cx="600" cy="220" r="3.5" fill="#8b5cf6" fill-opacity="0.5"/>
    
    <circle cx="280" cy="280" r="16" fill="url(#nodeGlow)"/>
    <circle cx="280" cy="280" r="3" fill="#3b82f6" fill-opacity="0.45"/>
    
    <circle cx="520" cy="100" r="15" fill="url(#nodeGlow)"/>
    <circle cx="520" cy="100" r="3" fill="#3b82f6" fill-opacity="0.4"/>
    
    <!-- Edge nodes -->
    <circle cx="80" cy="180" r="12" fill="url(#nodeGlow)"/>
    <circle cx="80" cy="180" r="2.5" fill="#3b82f6" fill-opacity="0.35"/>
    
    <circle cx="720" cy="200" r="14" fill="url(#nodeGlow)"/>
    <circle cx="720" cy="200" r="3" fill="#3b82f6" fill-opacity="0.4"/>
    
    <circle cx="100" cy="300" r="12" fill="url(#nodeGlow)"/>
    <circle cx="100" cy="300" r="2.5" fill="#8b5cf6" fill-opacity="0.3"/>
    
    <circle cx="700" cy="280" r="14" fill="url(#nodeGlow)"/>
    <circle cx="700" cy="280" r="3" fill="#8b5cf6" fill-opacity="0.35"/>
  </g>
  
  <!-- Cloud shapes (abstract) -->
  <g fill="#3b82f6" fill-opacity="0.03">
    <ellipse cx="200" cy="80" rx="80" ry="40"/>
    <ellipse cx="600" cy="320" rx="100" ry="45"/>
    <ellipse cx="700" cy="60" rx="60" ry="30"/>
  </g>
</svg>
